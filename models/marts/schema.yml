version: 2

models:
  - name: customer_summary
    description: "Aggregated metrics per customer"
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

models:
  - name: customer_profile
    description: "Customer profile with calculated membership duration"
    columns:
      - name: full_name
        tests:
          - not_null
